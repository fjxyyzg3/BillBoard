name: billboard-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: billboard_dev
      POSTGRES_USER: billboard
      POSTGRES_PASSWORD: billboard
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billboard -d billboard_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
