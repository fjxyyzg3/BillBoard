# Include this inside the HTTPS server block for the BillBoard hostname.
# The import agent is container-internal and must not have an nginx location.

location = /api/voice/audio {
  # The query contains a short-lived bearer capability, including on failures.
  access_log off;
  error_log /dev/null crit;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options "DENY" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_pass http://127.0.0.1:3000;
}

location = /api/voice/audio/ {
  # Reject the trailing slash before Next.js can redirect and log its query.
  access_log off;
  error_log /dev/null crit;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options "DENY" always;
  return 404;
}

location / {
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options "DENY" always;

  # Keep room for the existing 20 MiB bill upload and multipart overhead.
  # The voice endpoint enforces its own stricter 2 MiB body limit.
  client_max_body_size 25m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_pass http://127.0.0.1:3000;
}
