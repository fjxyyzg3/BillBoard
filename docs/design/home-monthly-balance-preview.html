  <!-- Editable CSS source: home-monthly-balance-preview.css. Embedded for standalone previews. -->
  <style id="preview-style">
:root {
  color-scheme: light;
  --bg: #fcfbfa;
  --surface: #ffffff;
  --ink: #303138;
  --muted: #6b6e76;
  --primary: #c64d3b;
  --primary-hover: #ad4030;
  --accent-ink: #a44232;
  --accent-soft: #fff0eb;
  --coral: #ef745d;
  --income: #2b815b;
  --income-ink: #1f5c42;
  --income-soft: #e6f3ec;
  --danger: #bb2e28;
  --warm: #f6f5f3;
  --line: #eeece9;
  --line-strong: #dcdad7;
  --shadow: 0 2px 8px rgb(48 49 56 / 1.8%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px;
  font-synthesis: none;
  color: var(--ink);
  background: #f2f1ef;
}

* { box-sizing: border-box; }
body { margin: 0; line-height: 1.5; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; }
button, select { color: inherit; cursor: pointer; }
button { border: 0; background: none; touch-action: manipulation; }
button:disabled { cursor: not-allowed; opacity: .5; }
select { min-width: 0; font-size: 16px; }
h1, h2, h3, p, dl, dd, ul { margin: 0; }
h1, h2, h3, strong { font-weight: 550; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
ul { padding: 0; list-style: none; }
svg { display: inline-block; flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
button svg, label svg { pointer-events: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
[hidden] { display: none !important; }
::selection { background: #fbd6cb; }
.svg-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.amount, .summary-value, .secondary-value, .trend-value, .detail-values dd, .category-amount, .category-share, .record-amount { font-variant-numeric: tabular-nums; }
.income { color: var(--income-ink); }
.negative, .deficit { color: var(--danger); }
.muted { color: var(--muted); }

/* Preview controls are separate from the application surface. */
.preview-bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; min-height: 64px; padding: 8px 24px; border-bottom: 1px solid var(--line-strong); background: var(--surface); }
.preview-brand, .preview-tools { display: flex; align-items: center; gap: 12px; min-width: 0; }
.preview-brand { font-size: 13px; }
.preview-brand strong { white-space: nowrap; }
.preview-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
.preview-badge { color: var(--muted); font-size: 11px; }
.preview-tools { gap: 10px; }
.scenario-control { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
.scenario-control > span { white-space: nowrap; }
.scenario-control select { min-height: 44px; max-width: 170px; padding: 0 25px 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: 12px; }
.device-switch { display: flex; flex: none; gap: 2px; padding: 3px; border-radius: 10px; background: var(--warm); }
.device-switch button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 7px; color: var(--muted); font-size: 12px; }
.device-switch button svg { width: 16px; height: 16px; }
.device-switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgb(48 49 56 / 5%); }
.locale-button { min-width: 44px; min-height: 44px; padding: 0 8px; border-radius: 8px; font-size: 12px; font-weight: 550; }
.locale-button:hover, .dialog-close:hover { background: var(--warm); }

/* Container queries let the phone preview work inside a desktop window. */
.app-frame { container: app / inline-size; width: 100%; min-height: calc(100dvh - 64px); background: var(--bg); }
body[data-device="phone"] .app-frame { max-width: 390px; margin: 24px auto; border: 1px solid var(--line-strong); border-radius: 24px 24px 0 0; }
.app-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: inherit; }
.sidebar { position: sticky; top: 64px; align-self: start; display: flex; flex-direction: column; min-height: 600px; height: calc(100dvh - 64px); padding: 35px 14px 22px; border-right: 1px solid var(--line); background: #f8f7f5; }
.brand-block { padding: 0 16px 35px; }
.wordmark { font-size: 23px; font-weight: 600; }
.wordmark-dot { color: var(--primary); }
.tagline { margin-top: 7px; font-size: 11px; color: var(--muted); }
.side-nav { display: grid; gap: 5px; }
.nav-item { display: flex; align-items: center; gap: 11px; min-height: 48px; padding: 11px 16px; border-radius: 11px; color: var(--muted); font-size: 13px; }
.nav-item svg { width: 18px; height: 18px; }
.nav-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 550; }
.sidebar-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 26px 10px 0; }
.avatar { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface); color: var(--muted); font-size: 12px; }
.sidebar-foot p { font-size: 12px; }
.sidebar-foot div > span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
.workspace { width: 100%; min-width: 0; max-width: 1240px; margin: 0 auto; padding: 32px 36px 40px; }
.mobile-brand { display: none; }
.home-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.range-control { position: relative; display: inline-flex; align-items: center; gap: 10px; min-width: 0; max-width: calc(100% - 75px); min-height: 44px; color: var(--ink); font-size: 25px; font-weight: 500; }
.range-control > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.range-control > svg { width: 18px; height: 18px; color: var(--muted); }
.range-control select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
.range-control:has(select:focus-visible), .ledger-control:has(select:focus-visible), .member-control:has(select:focus-visible) { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 7px; }
.member-control { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 44px; }
.member-control select { appearance: none; width: auto; max-width: 92px; min-height: 44px; padding: 0 0 0 7px; border: 0; background: transparent; font-size: 12px; }
.member-control svg { width: 13px; height: 13px; color: var(--muted); }
.scope-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; margin-bottom: 22px; }
.ledger-control { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%; min-height: 44px; color: var(--muted); }
.ledger-control svg { width: 16px; height: 16px; }
.ledger-control .chevron-small { width: 12px; height: 12px; }
.ledger-control select { appearance: none; max-width: 235px; min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
.range-caption { color: var(--muted); font-size: 11px; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
.kicker { color: var(--muted); font-size: 12px; font-weight: 400; }
.summary-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 26px 23px; }
.summary-main > div { min-width: 0; }
.summary-value { display: flex; align-items: baseline; gap: 7px; margin-top: 7px; font-size: clamp(28px, 3.2vw, 36px); font-weight: 450; line-height: 1.25; white-space: nowrap; }
.currency { font-size: .7em; font-weight: 400; }
.record-count { padding-top: 4px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.summary-secondary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.summary-secondary > div { min-width: 0; padding: 17px 26px 19px; }
.summary-secondary > div + div { border-left: 1px solid var(--line); }
.secondary-value { display: flex; align-items: baseline; gap: 5px; margin-top: 6px; font-size: 20px; font-weight: 450; line-height: 1.25; white-space: nowrap; }

.report-grid { display: grid; grid-template-columns: minmax(0, 1fr) 284px; align-items: start; gap: 18px; margin-top: 20px; }
.trend-card { padding: 21px 22px 18px; }
.trend-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.trend-header h2, .category-header h2 { font-size: 15px; font-weight: 500; }
.view-switch { display: inline-grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 100%; gap: 3px; padding: 3px; border-radius: 11px; background: var(--warm); }
.view-switch button { min-width: 0; min-height: 44px; padding: 7px 11px; border-radius: 8px; color: var(--muted); font-size: 12px; line-height: 1.35; }
.view-switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgb(48 49 56 / 5%); }
.view-switch button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.trend-overview { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
.trend-overview > div:first-child { min-width: 0; }
.trend-value { margin-top: 4px; font-size: 28px; font-weight: 450; line-height: 1.3; overflow-wrap: anywhere; }
.trend-value .currency { margin-right: 5px; }
.chart-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding-bottom: 6px; font-size: 11px; color: var(--muted); }
.chart-legend > span, .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chart-legend i, .legend-dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
.chart-legend .income i, .chart-legend i.income, .legend-dot.income, .legend-dot.income-dot { background: var(--income); }
.chart-legend .expense i, .chart-legend i.expense, .legend-dot.expense, .legend-dot.expense-dot { background: var(--coral); }
.chart-explanation { min-height: 35px; margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.7; }
.chart-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 15px; color: var(--muted); font-size: 10px; }
.plot-wrap { position: relative; width: 100%; min-width: 0; height: 238px; margin-top: 9px; border-radius: 5px; }
.plot-wrap:has(.chart-picker:focus-visible) { outline: 2px solid var(--primary); outline-offset: 4px; }
.trend-svg { display: block; width: 100%; height: 100%; overflow: visible; stroke: none; }
.chart-picker { position: absolute; inset: 14px 18px 32px 52px; width: calc(100% - 70px); height: calc(100% - 46px); margin: 0; opacity: 0; cursor: crosshair; touch-action: pan-y; }
.grid-line { stroke: var(--line); stroke-width: 1; }
.zero-line { stroke: var(--line-strong); stroke-width: 1.15; }
.axis-label { fill: var(--muted); stroke: none; font-family: inherit; font-size: 11px; font-variant-numeric: tabular-nums; }
.axis-label.selected { fill: var(--accent-ink); font-weight: 600; }
.series-income, .series-expense, .series-balance, .series-cumulative { fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.series-income { stroke: var(--income); }
.series-expense { stroke: var(--coral); }
.series-balance, .series-cumulative { stroke: var(--primary); }
.selection-line { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 4; }
.selected-dot { fill: var(--surface); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.empty-note { padding: 8px 0 12px; color: var(--muted); font-size: 12px; text-align: center; }
.point-detail { margin-top: 15px; padding: 15px 16px 8px; border-radius: 12px; background: var(--warm); }
.detail-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.detail-header strong { font-size: 13px; font-weight: 550; }
.detail-header > span { color: var(--muted); font-size: 11px; }
.detail-dates { margin-top: 3px; color: var(--muted); font-size: 10px; }
.detail-values { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; margin-top: 15px; }
.detail-stat { min-width: 0; }
.detail-stat dt { color: var(--muted); font-size: 10px; }
.detail-stat dd { margin-top: 3px; font-size: 14px; font-weight: 450; overflow-wrap: anywhere; }
.detail-stat.emphasis dd { font-weight: 550; }
.detail-bottom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0 12px; margin-top: 10px; }
.text-link { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-height: 44px; padding: 3px 0; color: var(--accent-ink); font-size: 11px; font-weight: 550; }
.text-link svg { width: 13px; height: 13px; }
.chart-footer { display: flex; align-items: flex-start; gap: 7px; margin-top: 15px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.footer-mark { flex: none; width: 4px; height: 4px; margin-top: 6px; border-radius: 50%; background: var(--line-strong); }

.categories-card { padding: 23px 20px 18px; }
.category-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.category-kind { padding: 4px 9px; border-radius: 7px; background: var(--warm); color: var(--muted); font-size: 11px; }
.donut-wrap { position: relative; width: 190px; height: 190px; margin: 22px auto 19px; }
#category-svg { display: block; width: 100%; height: 100%; stroke: none; }
#category-svg circle { fill: none; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
.donut-center > span { color: var(--muted); font-size: 10px; }
.donut-center strong { max-width: 125px; font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
.category-list { display: grid; }
.category-item { display: grid; grid-template-columns: minmax(0, 1fr) auto 34px; align-items: center; gap: 8px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 11px; }
.category-label { display: flex; align-items: center; gap: 7px; min-width: 0; }

.records-dialog::backdrop { background: rgb(48 49 56 / 32%); }
.dialog-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 20px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.dialog-header h2 { font-size: 17px; }
.dialog-header p { margin-top: 6px; color: var(--muted); font-size: 11px; }
.dialog-close { display: grid; place-items: center; flex: none; min-width: 44px; min-height: 44px; margin: -8px -8px 0 0; border-radius: 10px; color: var(--muted); }
.dialog-close svg { width: 18px; height: 18px; }
.record-list { padding: 0 20px 16px; }
.record-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 76px; padding: 15px 0; border-bottom: 1px solid var(--line); }

.record-copy { min-width: 0; }
.record-note { font-size: 13px; overflow-wrap: anywhere; }
.record-meta { margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.6; }
.record-amount { flex: none; font-size: 14px; white-space: nowrap; }

.noscript-note { position: fixed; inset: 20px; z-index: 40; height: fit-content; margin: auto; padding: 24px; border: 1px solid var(--line-strong); border-radius: 16px; background: var(--surface); font-size: 14px; }

@container app (max-width: 1100px) {
  .workspace { padding-right: 28px; padding-left: 28px; }
  .report-grid { grid-template-columns: minmax(0, 1fr); }
  .categories-card { display: grid; grid-template-columns: 190px minmax(0, 1fr); column-gap: 30px; align-items: center; }

  .bottom-nav > span { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; color: var(--muted); font-size: 11px; }

@container app (max-width: 350px) {
  .workspace { padding-right: 14px; padding-left: 14px; }

body[data-device="phone"] .records-dialog { inset: auto 0 0; width: min(390px, 100%); max-height: 85dvh; margin: 0 auto; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom); }

  .records-dialog { inset: auto 0 0; width: 100%; max-height: 85dvh; margin: 0 auto; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom); }

    $("total-income").textContent = number(data.summary.incomeFen);
    $("total-net").textContent = amount(data.summary.netFen);
    $("net-summary").classList.toggle("deficit", data.summary.netFen < 0);
    $("total-count").textContent = countLabel(data.summary.transactionCount);
    document.querySelectorAll("[data-view]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.view === state.view)));
    const last = data.monthly.at(-1);
    let label = t("selectedExpense");
    let value = money(data.summary.expenseFen);
    let note = t(state.range === "month" ? "cashflowDayNote" : "cashflowMonthNote");
    let legend = `<span><i class="legend-dot income-dot"></i>${t("income")}</span><span><i class="legend-dot expense-dot"></i>${t("expense")}</span>`;
    if (state.view === "cumulative") {
      label = t("endNet"); value = money(last?.cumulativeNetFen ?? 0); note = t("cumulativeNote");
      legend = `<span><i class="legend-dot cumulative-dot"></i>${t("cumulative")}</span>`;
    } else if (state.view === "balance") {
      label = state.locale === "zh-CN" ? `${monthName(last.key)}结余` : `${monthName(last.key)} net`;
      value = money(last.netFen); note = t("balanceNote");
      legend = `<span><i class="legend-dot balance-dot"></i>${t("net")}</span>`;
    }
    $("metric-label").textContent = label;
    $("metric-value").textContent = value;
    $("metric-value").className = `trend-value${(state.view === "balance" && last.netFen < 0) || (state.view === "cumulative" && last.cumulativeNetFen < 0) ? " negative" : ""}`;
    $("chart-explanation").textContent = note;
    $("chart-legend").innerHTML = legend;
    $("chart-hint").textContent = t(state.view === "cashflow" && state.range === "month" ? "pickDay" : "pickMonth");
    $("chart-footer").textContent = state.view === "cashflow" ? `${t(state.member === "all" ? "household" : state.member)} · ${t({ all: "allLedgers", daily: "dailyLedger", travel: "travelLedger" }[state.ledger])}` : t(state.view === "cumulative" ? "cumulativeFooter" : "balanceFooter");
    $("empty-note").hidden = data.summary.transactionCount !== 0;
    $("empty-note").textContent = t("noRecords");
    const picker = $("chart-picker");
    picker.max = String(Math.max(0, data.points.length - 1));
    picker.value = String(Math.max(0, data.points.findIndex((point) => point.key === state.selected)));
    $("chart-summary").textContent = data.points.map((point) => `${point.key}: ${t(state.view)} ${money(state.view === "cumulative" ? point.cumulativeNetFen : point.netFen)}`).join("; ");
    drawChart(data);
    renderDetail(data);
    renderCategories(data);
  }

  function svgNode(tag, attrs, text) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function niceStep(value) {
    const power = 10 ** Math.floor(Math.log10(value));
    return [1, 2, 2.5, 5, 10].find((step) => step * power >= value) * power;
  }

  function drawChart(data) {
    const svg = $("trend-svg");
    const width = Math.max(220, $("plot-wrap").clientWidth);
    const height = $("plot-wrap").clientHeight || 238;
    const left = width < 330 ? 42 : 52;
    const right = 16, top = 14, bottom = 32;
    const plotWidth = width - left - right, plotHeight = height - top - bottom;
    const values = data.points.flatMap((point) => state.view === "cashflow" ? [point.incomeFen, point.expenseFen] : [state.view === "cumulative" ? point.cumulativeNetFen : point.netFen]);
    const low = Math.min(0, ...values), high = Math.max(0, ...values);
    const step = niceStep(Math.max(10000, high - low) / 3);
    const min = Math.floor(low / step) * step;
    const max = Math.max(min + step, Math.ceil(high / step) * step);
    const x = (index) => left + plotWidth * (index + 0.5) / data.points.length;
    const y = (value) => top + (max - value) / (max - min) * plotHeight;
    const compact = new Intl.NumberFormat(state.locale, { notation: "compact", maximumFractionDigits: 1 });
    svg.replaceChildren();
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    for (let value = min; value <= max + step / 2; value += step) {
      svg.append(svgNode("line", { x1: left, x2: width - right, y1: y(value), y2: y(value), class: value === 0 ? "zero-line" : "grid-line" }));
      svg.append(svgNode("text", { x: left - 9, y: y(value) + 4, "text-anchor": "end", class: "axis-label" }, compact.format(value / 100)));
    }
    const tickCount = Math.min(width < 400 ? 4 : 6, data.points.length);
    const ticks = new Set(Array.from({ length: tickCount }, (_, i) => tickCount === 1 ? 0 : Math.round(i * (data.points.length - 1) / (tickCount - 1))));
    ticks.forEach((index) => {
      const point = data.points[index];
      const label = point.key.length === 10 ? state.locale === "zh-CN" ? `${Number(point.key.slice(-2))}日` : dateName(point.key) : state.range === "all" ? state.locale === "zh-CN" ? `${point.key.slice(2, 4)}/${Number(point.key.slice(-2))}` : monthName(point.key, true) : monthName(point.key);
      svg.append(svgNode("text", { x: x(index), y: height - 8, "text-anchor": "middle", class: `axis-label${state.selected === point.key ? " selected" : ""}` }, label));
    });
    const series = state.view === "cashflow" ? [["incomeFen", "series-income"], ["expenseFen", "series-expense"]] : state.view === "cumulative" ? [["cumulativeNetFen", "series-cumulative"]] : [["netFen", "series-balance"]];
    series.forEach(([key, className]) => {
      svg.append(svgNode("path", { d: data.points.map((point, index) => `${index ? "L" : "M"}${x(index)} ${y(point[key])}`).join(" "), class: className }));
      data.points.forEach((point, index) => svg.append(svgNode("circle", { cx: x(index), cy: y(point[key]), r: data.points.length === 1 ? 4 : 2.5, class: `${className} series-point` })));
    });
    const selectedIndex = data.points.findIndex((point) => point.key === state.selected);
    if (selectedIndex >= 0) {
      const selected = data.points[selectedIndex];
      svg.append(svgNode("line", { x1: x(selectedIndex), x2: x(selectedIndex), y1: top, y2: height - bottom, class: "selection-line" }));
      series.forEach(([key, className]) => svg.append(svgNode("circle", { cx: x(selectedIndex), cy: y(selected[key]), r: 5, class: `selected-dot ${className}` })));
    }
    const padding = data.points.length > 1 ? plotWidth / data.points.length / 2 : 0;
    Object.assign($("chart-picker").style, { left: `${left + padding}px`, right: `${right + padding}px`, top: `${top}px`, bottom: `${bottom}px`, width: `${plotWidth - padding * 2}px`, height: `${plotHeight}px` });
    const current = data.points[Math.max(0, selectedIndex)];
    $("chart-picker").setAttribute("aria-valuetext", current ? `${current.key}, ${state.view === "cashflow" ? `${t("income")} ${money(current.incomeFen)}, ${t("expense")} ${money(current.expenseFen)}` : `${t(state.view)} ${money(state.view === "cumulative" ? current.cumulativeNetFen : current.netFen)}`}` : "");
  }

  function renderDetail(data) {
    const point = data.points.find((item) => item.key === state.selected);
    $("point-detail").hidden = !point;
    if (!point) return;
    const daily = point.key.length === 10;
    $("point-title").textContent = daily ? dateName(point.key, true) : monthName(point.key, true);
    $("point-count").textContent = countLabel(point.transactionCount);
    $("point-dates").textContent = dateRange(point.from, point.to);
    const fields = [[t("income"), money(point.incomeFen), "income"], [t("expense"), money(point.expenseFen), ""], [t(daily ? "dayNet" : "currentNet"), money(point.netFen), `${point.netFen < 0 ? "negative " : ""}${state.view === "balance" ? "emphasis" : ""}`]];
    if (state.view === "cumulative") fields.push([t("cumulative"), money(point.cumulativeNetFen), "emphasis"]);
    $("point-values").innerHTML = fields.map(([label, value, className]) => `<div class="detail-stat ${className}"><dt>${escape(label)}</dt><dd>${escape(value)}</dd></div>`).join("");
    $("records-open").hidden = point.transactionCount === 0;
    $("records-open").querySelector("span").textContent = t(daily ? "viewDayRecords" : "viewMonthRecords");
  }

  function renderCategories(data) {
    const groups = new Map();
    data.rows.filter((row) => row.type === "expense" && row.date >= data.range.from && row.date <= data.range.to).forEach((row) => groups.set(row.category, (groups.get(row.category) ?? 0) + row.amountFen));
    const categories = [...groups.entries()].sort((a, b) => b[1] - a[1]);
    const colors = ["#c64d3b", "#e99375", "#cbb29a", "#adbaa1", "#d7c99d", "#a1b7b7", "#c4c1bc"];
    const svg = $("category-svg");
    svg.replaceChildren(svgNode("circle", { cx: 100, cy: 100, r: 70, stroke: "#eeece9", "stroke-width": 15, fill: "none" }));
    const circumference = 2 * Math.PI * 70;
    let offset = 0;
    categories.forEach(([, fen], index) => {
      const length = fen / data.summary.expenseFen * circumference;
      svg.append(svgNode("circle", { cx: 100, cy: 100, r: 70, fill: "none", stroke: colors[index], "stroke-width": 15, "stroke-dasharray": `${Math.max(0, length - 3)} ${circumference - Math.max(0, length - 3)}`, "stroke-dashoffset": -offset, transform: "rotate(-90 100 100)" }));
      offset += length;
    });
    $("category-total").textContent = new Intl.NumberFormat(state.locale, { notation: "compact", maximumFractionDigits: 1 }).format(data.summary.expenseFen / 100);
    $("category-list").innerHTML = categories.map(([key, fen], index) => `<li class="category-item"><span class="category-label"><i class="category-swatch" style="background:${colors[index]}"></i>${escape(t(key))}</span><span class="category-amount">${number(fen)}</span><span class="category-share">${Math.round(fen / data.summary.expenseFen * 100)}%</span></li>`).join("");
    $("category-empty").hidden = categories.length !== 0;
  }

  function selectPoint(index) {
    const data = model();
    const safeIndex = Math.max(0, Math.min(data.points.length - 1, index));
    state.selected = data.points[safeIndex]?.key ?? null;
    $("chart-picker").value = String(safeIndex);
    drawChart(data);
    renderDetail(data);
  }

  function openRecords() {
    const data = model();
    const point = data.points.find((item) => item.key === state.selected);
    if (!point?.transactionCount) return;
    $("records-title").textContent = dateRange(point.from, point.to, true);
    $("record-list").innerHTML = data.rows.filter((row) => row.date >= point.from && row.date <= point.to).map((row) => `<li class="record-row"><div class="record-copy"><p class="record-note">${escape(t(row.category))}</p><p class="record-meta">${escape(dateName(row.date))} · ${escape(t(row.member))} · ${escape(t(row.ledger === "daily" ? "dailyLedger" : "travelLedger"))}</p></div><span class="record-amount ${row.type}">${money(row.type === "income" ? row.amountFen : -row.amountFen, true)}</span></li>`).join("");
    $("records-dialog").showModal();
  }

  document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => { state.view = button.dataset.view; state.selected = null; render(); }));
  for (const key of ["range", "scenario", "member", "ledger"]) $(key + "-select").addEventListener("change", (event) => { state[key] = event.target.value; state.selected = null; render(); });
  document.querySelectorAll("button[data-device]").forEach((button) => button.addEventListener("click", () => {
    document.body.dataset.device = button.dataset.device;
    document.querySelectorAll("button[data-device]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
  }));
  $("locale-button").addEventListener("click", () => { state.locale = state.locale === "zh-CN" ? "en" : "zh-CN"; render(); });
  $("chart-picker").addEventListener("input", (event) => selectPoint(Number(event.target.value)));
  $("chart-picker").addEventListener("pointerdown", (event) => {
    const box = event.currentTarget.getBoundingClientRect();
    selectPoint(Math.round((event.clientX - box.left) / Math.max(1, box.width) * (model().points.length - 1)));
  });
  $("chart-picker").addEventListener("keydown", (event) => {
    const points = model().points;
    const current = Math.max(0, points.findIndex((point) => point.key === state.selected));
    const next = event.key === "Home" ? 0 : event.key === "End" ? points.length - 1 : ["ArrowLeft", "ArrowDown"].includes(event.key) ? current - 1 : ["ArrowRight", "ArrowUp"].includes(event.key) ? current + 1 : null;
    if (next !== null) { event.preventDefault(); selectPoint(next); }
  });
  $("records-open").addEventListener("click", openRecords);
  $("dialog-close").addEventListener("click", () => $("records-dialog").close());
  $("records-dialog").addEventListener("click", (event) => {
    if (event.target !== event.currentTarget) return;
    const box = event.currentTarget.getBoundingClientRect();
    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) event.currentTarget.close();
  });
  new ResizeObserver(() => drawChart(model())).observe($("plot-wrap"));
  render();
})();
  </script>
</body>
</html>
