<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>BillBoard · B2 轻盈暖色设计预览</title>
  <style>
    :root {
      color-scheme:light;
      --accent:#bd4938;
      --action:#c64d3b;
      --coral:#ef745d;
      --accent-soft:#fff0eb;
      --ink:#303138;
      --muted:#6b6e76;
      --line:#eeece9;
      --surface:#fff;
      --canvas:#fcfbfa;
      --green:#2b815b;
      --blue:#3883b5;
      --amber:#ab762a;
      --radius:20px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      font-size:14px;
      color:var(--ink);
      background:#f4f3f1;
      font-synthesis:none
    }
    * {
      box-sizing:border-box
    }
    body {
      margin:0
    }
    button,input,select,textarea {
      font:inherit
    }
    button,a,input,select,textarea {
      -webkit-tap-highlight-color:transparent
    }
    button {
      cursor:pointer;
      color:inherit
    }
    button {
      border:0;
      background:none
    }
    a {
      color:var(--accent)
    }
    button:active {
      transform:translateY(1px)
    }
    button:disabled {
      opacity:.5;
      cursor:not-allowed
    }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
      outline:2px solid var(--accent);
      outline-offset:3px
    }
    input,select,textarea {
      min-width:0;
      color:var(--ink)
    }
    h1,h2,h3,h4,p {
      margin:0
    }
    h1,h2,h3,h4,strong,b {
      font-weight:550
    }
    svg {
      display:inline-block;
      flex-shrink:0;
      vertical-align:middle
    }
    button svg {
      pointer-events:none
    }
    .icon {
      width:20px;
      height:20px;
      stroke-width:1.6
    }
    .hidden,[hidden] {
      display:none!important
    }
    .sr-only {
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0
    }
    ::selection {
      background:#fbd6cb
    }
    .studio-header {
      height:72px;
      background:rgba(255,255,255,.9);
      border-bottom:1px solid #e9e7e3;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px;
      gap:20px;
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(20px)
    }
    .brand {
      display:flex;
      align-items:center;
      gap:12px
    }
    .brand-mark {
      width:35px;
      height:35px;
      display:grid;
      place-items:center;
      border:1px solid #efcfc5;
      background:#fff4ee;
      border-radius:11px;
      color:var(--accent)
    }
    .brand-name {
      font-size:17px;
      font-weight:550;
      letter-spacing:-.03em
    }
    .brand-caption {
      color:var(--muted);
      font-size:11px;
      margin-top:3px
    }
    .studio-tools {
      display:flex;
      align-items:center;
      gap:14px
    }
    .studio-segment {
      display:flex;
      padding:3px;
      background:#f0efed;
      border-radius:10px;
      gap:3px
    }
    .studio-segment button {
      min-height:34px;
      padding:0 12px;
      font-size:12px;
      color:var(--muted);
      border-radius:7px
    }
    .studio-segment button[aria-pressed=true] {
      background:white;
      color:var(--ink);
      box-shadow:0 1px 4px #2020200d
    }
    .tool-button {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-height:40px;
      min-width:40px;
      font-size:12px;
      border-radius:10px
    }
    .tool-button:hover {
      background:#f1efec
    }
    .tool-button .icon {
      width:17px;
      height:17px
    }
    .studio {
      display:grid;
      grid-template-columns:226px minmax(0,1fr);
      min-height:calc(100vh - 72px)
    }
    .directory {
      background:#faf9f7;
      border-right:1px solid #e9e7e3;
      position:sticky;
      top:72px;
      height:calc(100vh - 72px);
      overflow:auto;
      padding:24px 15px;
      scrollbar-width:thin
    }
    .directory-intro {
      padding:0 10px 15px;
      font-size:11px;
      line-height:1.7;
      color:var(--muted)
    }
    .directory h2 {
      padding:16px 12px 7px;
      font-size:10px;
      letter-spacing:.06em;
      color:#81818a;
      font-weight:500
    }
    .page-link {
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:10px;
      min-height:40px;
      text-align:left;
      font-size:12px;
      color:#64646d
    }
    .page-link .icon {
      width:16px;
      height:16px
    }
    .page-link:hover {
      background:#efeeeb
    }
    .page-link[aria-current=page] {
      background:#f8e9e2;
      color:#9c4334
    }
    .page-index {
      margin-left:auto;
      color:#909099;
      font-size:10px;
      font-variant-numeric:tabular-nums
    }
    .directory-footer {
      border-top:1px solid #e9e7e3;
      margin:25px 10px 0;
      padding-top:18px;
      line-height:1.8;
      font-size:10px;
      color:var(--muted)
    }
    .palette {
      display:flex;
      gap:6px;
      margin-bottom:10px
    }
    .swatch {
      width:17px;
      height:17px;
      border-radius:50%;
      border:1px solid #00000009
    }
    .workspace {
      min-width:0
    }
    .canvas-header {
      padding:24px 30px 17px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px
    }
    .canvas-label {
      font-size:16px;
      font-weight:500
    }
    .canvas-description {
      font-size:12px;
      line-height:1.7;
      color:var(--muted);
      margin-top:5px;
      max-width:620px
    }
    .canvas-meta {
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      color:var(--muted);
      font-size:11px
    }
    .status-dot {
      height:5px;
      width:5px;
      background:var(--green);
      border-radius:50%
    }
    .canvas-stage {
      padding:8px 30px 42px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:800px
    }
    .device {
      width:390px;
      height:844px;
      flex-shrink:0;
      position:relative;
      background:var(--canvas);
      border:1px solid #dfdcd7;
      border-radius:38px;
      overflow:hidden;
      box-shadow:0 22px 55px -28px #52493d3b,0 3px 8px #52493d05;
      container:device / inline-size
    }
    .device.desktop {
      width:100%;
      max-width:1260px;
      height:820px;
      border-radius:18px
    }
    .statusbar {
      height:42px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 25px;
      font-size:12px;
      font-weight:550;
      flex-shrink:0
    }
    .system-icons {
      display:flex;
      align-items:center;
      gap:5px
    }
    .system-icons .icon {
      width:14px;
      height:14px;
      stroke-width:1.8
    }
    .battery {
      width:20px;
      height:9px;
      border-radius:3px;
      border:1px solid currentColor;
      padding:1px;
      position:relative
    }
    .battery:before {
      content:'';
      display:block;
      background:currentColor;
      height:5px;
      border-radius:1px
    }
    .battery:after {
      content:'';
      position:absolute;
      width:2px;
      height:3px;
      right:-4px;
      top:2px;
      background:currentColor;
      border-radius:1px
    }
    .app-layout {
      display:flex;
      height:calc(100% - 42px)
    }
    .app-sidebar {
      display:none;
      width:188px;
      flex-shrink:0;
      background:#f5f3f0;
      border-right:1px solid var(--line);
      padding:24px 14px
    }
    .app-sidebar .brand-name {
      padding:0 10px;
      margin-bottom:30px;
      color:var(--accent)
    }
    .app-sidebar button {
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      text-align:left;
      border-radius:10px;
      min-height:44px;
      padding:10px;
      color:var(--muted);
      font-size:13px
    }
    .app-sidebar button.selected {
      color:var(--accent);
      background:var(--accent-soft)
    }
    .app-sidebar .icon {
      width:18px;
      height:18px
    }
    .app-main {
      position:relative;
      flex:1;
      min-width:0;
      height:100%;
      display:flex;
      flex-direction:column
    }
    .app-toolbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      height:46px;
      flex-shrink:0;
      gap:12px
    }
    .scope-button {
      display:flex;
      align-items:center;
      gap:7px;
      background:#f1efec;
      border-radius:20px;
      padding:0 11px;
      min-height:32px;
      font-size:12px
    }
    .scope-button .icon {
      width:13px;
      height:13px
    }
    .icon-button {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:44px;
      min-height:44px;
      border-radius:50%
    }
    .icon-button:hover {
      background:#efeeeb
    }
    .app-scroll {
      overflow:auto;
      overscroll-behavior:contain;
      padding:12px 19px 100px;
      flex:1;
      scrollbar-width:thin;
      scrollbar-color:#dedbd5 transparent
    }
    .app-scroll.no-tabs {
      padding-bottom:30px
    }
    .app-scroll>*+* {
      margin-top:16px
    }
    .bottom-nav {
      position:absolute;
      bottom:24px;
      left:14px;
      right:14px;
      height:58px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      align-items:center;
      background:rgba(255,255,255,.84);
      border:1px solid #ffffffb3;
      box-shadow:0 3px 16px #43382c0b,0 0 0 1px #39312905;
      backdrop-filter:blur(20px) saturate(1.25);
      border-radius:30px;
      z-index:5;
      padding:4px
    }
    .bottom-nav button {
      height:48px;
      display:flex;
      flex-direction:column;
      gap:3px;
      align-items:center;
      justify-content:center;
      border-radius:24px;
      font-size:10px
    }
    .bottom-nav button[aria-current=page] {
      color:var(--accent);
      background:#fceee8
    }
    .bottom-nav .icon {
      height:19px;
      width:19px
    }
    .plus-disc {
      width:23px;
      height:23px;
      background:var(--coral);
      border-radius:50%;
      color:white;
      display:grid;
      place-items:center
    }
    .plus-disc .icon {
      height:17px;
      width:17px
    }
    .home-indicator {
      position:absolute;
      width:112px;
      height:4px;
      border-radius:4px;
      background:#34353b;
      bottom:8px;
      left:calc(50% - 56px);
      z-index:8
    }
    .desktop .statusbar {
      height:34px;
      background:#fff;
      border-bottom:1px solid var(--line);
      font-size:10px
    }
    .desktop .app-layout {
      height:calc(100% - 34px)
    }
    .desktop .home-indicator {
      display:none
    }
    .mobile-page-selector {
      display:none
    }
    .gallery {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(325px,1fr));
      align-items:start;
      gap:30px;
      width:100%;
      max-width:1600px
    }
    .gallery-item {
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px
    }
    .gallery-item .device {
      width:min(100%,390px);
      height:790px;
      border-radius:30px
    }
    .gallery-caption {
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:12px;
      gap:10px;
      padding:0 4px
    }
    .gallery-caption span {
      color:var(--muted);
      font-size:11px
    }
    .gallery-caption button {
      min-height:36px;
      color:var(--accent)
    }
    .stack {
      display:flex;
      flex-direction:column;
      gap:16px
    }
    .stack>* {
      margin:0
    }
    .page-head {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:20px
    }
    .page-title {
      font-size:24px;
      line-height:1.25;
      letter-spacing:-.025em;
      font-weight:500;
      text-wrap:balance
    }
    .page-subtitle {
      font-size:12px;
      color:var(--muted);
      line-height:1.65;
      margin-top:7px
    }
    .page-head-actions {
      display:flex;
      align-items:center;
      gap:3px;
      flex-shrink:0
    }
    .page-head-actions .button {
      padding:0 10px;
      min-height:32px;
      font-size:12px
    }
    .muted {
      color:var(--muted)
    }
    .caption {
      font-size:12px;
      line-height:1.6;
      color:var(--muted)
    }
    .body-copy {
      font-size:14px;
      line-height:1.75
    }
    .kicker {
      font-size:12px;
      color:var(--muted);
      line-height:1.5
    }
    .section-title {
      font-size:15px;
      line-height:1.45;
      font-weight:500
    }
    .panel {
      background:#fff;
      border:1px solid #f1efec;
      border-radius:var(--radius);
      padding:17px;
      box-shadow:0 2px 6px #473b2603;
      min-width:0
    }
    .panel-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:16px
    }
    .panel-head h2,.panel-head h3 {
      font-size:15px;
      font-weight:500
    }
    .panel-head .text-link {
      font-size:11px;
      min-height:28px
    }
    .panel:has(.row-list) {
      padding-bottom:8px
    }
    .split {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:12px
    }
    .grid-two {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px
    }
    .divider {
      border:0;
      border-top:1px solid var(--line);
      margin:16px 0
    }
    .button {
      display:inline-flex;
      flex-shrink:0;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:44px;
      line-height:1.4;
      border:1px solid transparent;
      border-radius:12px;
      padding:10px 16px;
      font-size:14px;
      font-weight:500;
      text-align:center
    }
    .button.primary {
      background:var(--action);
      color:#fff
    }
    .button.primary:hover {
      background:#b94937
    }
    .button.secondary {
      background:#f5f3f0;
      color:var(--ink)
    }
    .button.subtle {
      background:transparent;
      color:var(--accent);
      padding-inline:5px
    }
    .button.danger {
      background:#fff1ee;
      color:#ae3e31
    }
    .button.full {
      width:100%
    }
    .button .icon {
      width:17px;
      height:17px
    }
    .text-link {
      color:var(--accent);
      font-size:13px;
      min-height:44px;
      display:inline-flex;
      align-items:center;
      gap:5px
    }
    .text-link .icon {
      width:14px;
      height:14px
    }
    .chip,.badge {
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:4px 8px;
      border-radius:7px;
      font-size:10px;
      line-height:1.4;
      background:#f2f1ef;
      color:var(--muted);
      white-space:nowrap
    }
    .chip.success,.badge.success {
      background:#eaf5ee;
      color:#28754b
    }
    .chip.warning,.badge.warning {
      background:#fff5e2;
      color:#8a6023
    }
    .chip.accent,.badge.accent {
      background:var(--accent-soft);
      color:var(--accent)
    }
    .chips {
      display:flex;
      flex-wrap:wrap;
      gap:7px
    }
    .notice {
      display:flex;
      gap:9px;
      align-items:flex-start;
      border-radius:12px;
      padding:13px;
      background:#f5f3f0;
      font-size:12px;
      line-height:1.65;
      color:#66646a
    }
    .notice .icon {
      width:17px;
      height:17px;
      margin-top:1px
    }
    .notice.success {
      background:#eef7f1;
      color:#357253
    }
    .notice.warning {
      background:#fff6e8;
      color:#85612d
    }
    .notice.danger {
      background:#fff0ec;
      color:#a64233
    }
    .row-list {
      display:flex;
      flex-direction:column
    }
    .setting-row {
      display:flex;
      align-items:center;
      gap:11px;
      min-height:58px;
      padding:11px 0;
      border-bottom:1px solid var(--line);
      width:100%;
      text-align:left
    }
    .setting-row:last-child {
      border-bottom:0
    }
    .setting-row>button {
      flex:1
    }
    .row-icon {
      width:32px;
      height:32px;
      display:grid;
      place-items:center;
      flex-shrink:0;
      background:#f8f4ef;
      border-radius:10px;
      color:var(--accent)
    }
    .row-icon .icon {
      width:17px;
      height:17px
    }
    .row-copy {
      flex:1;
      min-width:0
    }
    .row-label {
      font-size:14px;
      font-weight:400;
      line-height:1.5
    }
    .row-detail {
      font-size:11px;
      color:var(--muted);
      line-height:1.6;
      margin-top:3px;
      overflow-wrap:anywhere
    }
    .row-value {
      font-size:12px;
      color:var(--muted);
      flex-shrink:0;
      max-width:45%;
      text-align:right
    }
    .setting-row>.icon {
      width:14px;
      height:14px;
      color:#919096
    }
    .form {
      display:flex;
      flex-direction:column;
      gap:16px
    }
    .field {
      display:flex;
      flex-direction:column;
      gap:7px;
      font-size:12px;
      min-width:0
    }
    .field>span:first-child {
      color:#55555e
    }
    .input {
      width:100%;
      background:#fcfbfa;
      border:1px solid #e7e4df;
      border-radius:11px;
      padding:11px 12px;
      min-height:44px;
      font-size:14px;
      line-height:1.5
    }
    .input::placeholder {
      color:#85828a;
      font-size:12px
    }
    .input:hover {
      border-color:#d3ccc4
    }
    textarea.input {
      resize:vertical;
      min-height:94px
    }
    .field select,.input:is(select) {
      padding-right:24px
    }
    .field-help {
      font-size:11px;
      line-height:1.6;
      color:var(--muted)
    }
    .segmented {
      display:flex;
      padding:3px;
      border-radius:12px;
      background:#f3f1ef;
      gap:3px
    }
    .segmented button {
      flex:1;
      min-width:0;
      border-radius:9px;
      min-height:36px;
      font-size:13px;
      color:var(--muted);
      padding:6px
    }
    .segmented button.selected {
      color:var(--accent);
      background:#fff0eb;
      font-weight:500
    }
    .segmented.neutral button.selected {
      background:white;
      color:var(--ink);
      box-shadow:0 1px 3px #00000006
    }
    .empty-state {
      text-align:center;
      padding:40px 16px;
      display:flex;
      align-items:center;
      flex-direction:column;
      gap:12px
    }
    .empty-state>.icon {
      width:36px;
      height:36px;
      color:#bcb6ac;
      stroke-width:1.2
    }
    .empty-state h2,.empty-state h3 {
      font-size:16px;
      font-weight:500
    }
    .empty-state p {
      font-size:12px;
      color:var(--muted);
      line-height:1.7;
      max-width:290px
    }
    .switch {
      position:relative;
      width:40px;
      height:24px;
      flex-shrink:0;
      background:#d8d5d0;
      border-radius:15px;
      min-width:40px
    }
    .switch:before {
      content:'';
      position:absolute;
      top:3px;
      left:3px;
      width:18px;
      height:18px;
      background:white;
      border-radius:50%;
      box-shadow:0 1px 3px #0002;
      transition:transform 160ms ease-out
    }

    function editRecord(id,trigger){const r=state.records.find(r=>r.id===Number(id));if(!r)return;activeRecordId=r.id;const readonly=r.ledger==='renovation';showDialog(t('编辑记录','Edit record'),readonly?notice(t('此账本已归档，记录仅可查看。','This ledger is archived. Records are read-only.')):modalForm('edit-record',`${selectField(t('记入账本','Ledger'),'ledger',ledgerOptions(),r.ledger)}${selectField(t('交易类型','Type'),'type',[['expense',t('支出','Expense')],['income',t('收入','Income')]],r.type)}${field(t('金额（元）','Amount (yuan)'),'text','0.00','amount',money(r.amountFen).replace(/,/g,''))}${selectField(t('分类','Category'),'category',categories.filter(c=>r.type==='income'?['salary','bonus','other'].includes(c[0]):!['salary','bonus'].includes(c[0])).map(c=>[c[0],t(c[1],c[2])]),r.category)}${selectField(t('归属成员','Member'),'actor',[['lin',memberName('lin')],['xia',memberName('xia')]],r.actor)}${field(t('日期','Date'),'date','','date',r.date)}${field(t('备注','Note'),'text','','note',t(...r.note))}${actionButton(icon('trash')+t('删除这笔记录','Delete record'),'delete-record',String(r.id),'danger')}`,t('保存修改','Save changes')),trigger);}
    document.addEventListener('click',event=>{
      const control=event.target.closest('[data-action]');if(!control||control.disabled)return;
      const action=control.dataset.action,value=control.dataset.value||'';
      if(state.mode==='gallery'&&control.closest('[data-page]'))state.page=control.closest('[data-page]').dataset.page;
      if(action==='navigate'){navigate(value);return;}
      if(action==='sheet'){openSheet(value,control);return;}
      if(action==='close'){closeDialog();return;}
      if(action==='mode'){state.mode=value;if(value==='gallery')state.device='phone';renderStudio();return;}
      if(action==='device'){state.device=value;state.mode='focus';renderStudio();return;}
      if(action==='language'){closeDialog();state.locale=state.locale==='zh'?'en':'zh';renderStudio();return;}
      if(action==='reset'){closeDialog();const locale=state.locale,device=state.device;state=initialState();state.locale=locale;state.device=device;history.replaceState(null,'','#home');renderStudio();toast(t('示例已重置。','Demo reset.'));return;}
      if(action==='demo'){closeDialog();toast(demoMessage(value));return;}
      if(action==='toggle'){if(['ai','voice'].includes(value)){state[value]=!state[value];syncChoices();toast(t('已更新本次预览的处理选择。','Processing choices updated for this preview.'));}return;}
      if(action==='pick-scope'){state.viewLedger=value;closeDialog();renderStage();return;}
      if(action==='pick-member'){state.member=value;closeDialog();renderStage();return;}
      if(action==='pick-ledger'){if(ledgerOptions().some(([id])=>id===value)){state.entryLedger=value;closeDialog();renderStage();}return;}
      if(action==='category-records'){state.filterCategory=value;state.recordType=['salary','bonus'].includes(value)?'income':'expense';navigate('records');return;}
      if(action==='ledger-records'){state.viewLedger=value;state.member='all';state.search='';state.recordType='all';state.filterCategory='all';state.filterMin='';state.filterMax='';navigate('records');return;}
      if(action==='record-type'){state.recordType=value;renderStage();return;}
      if(action==='clear-filters'){state.recordType='all';state.search='';state.filterCategory='all';state.filterMin='';state.filterMax='';state.member='all';state.viewLedger='all';state.month='2026-10';state.rangeStart='';state.rangeEnd='';renderStage();return;}
      if(action==='entry-type'){state.entryType=value;state.entryCategory=value==='income'?'salary':'dining';renderStage();return;}
      if(action==='entry-category'){state.entryCategory=value;renderStage();return;}
      if(action==='select-source'){state.source=value;state.importSelected=[true,true];syncChoices();const file=control.closest('[data-page]')?.querySelector('input[type=file]');if(file){file.accept=value==='cmb'?'.pdf,.zip':value==='alipay'?'.csv':'.xlsx';file.value='';}return;}
      if(action==='edit-record'){editRecord(value,control);return;}
      if(action==='delete-record'){showDialog(t('删除这笔记录？','Delete this record?'),`<div class="stack">${notice(t('这只会从当前示例中移除记录，不影响真实账务。','This only removes the record from the current demo. Real records are unaffected.'))}${actionButton(t('确认删除','Confirm delete'),'confirm-delete',value,'danger full')}</div>`);return;}
      if(action==='confirm-delete'){state.records=state.records.filter(r=>r.id!==Number(value));closeDialog();renderStage();toast(t('示例记录已删除。','Sample record deleted.'));return;}
      if(action==='new-ledger-entry'){state.entryLedger=value;navigate('add');return;}
      if(action==='save-natural'){if(!state.ai||!state.nlResult)return;state.records.unshift({id:Date.now(),note:['午餐','Lunch'],category:'dining',amountFen:3850,type:'expense',actor:'lin',date:'2026-10-23',time:'12:08',ledger:state.entryLedger});state.nlResult=false;state.viewLedger='all';state.member='all';navigate('records');toast(t('示例记录已保存。','Sample record saved.'));}
    });
    document.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-record-search]')){state.search=el.value;el.closest('.device').querySelector('[data-record-list]').innerHTML=recordList();}if(el.matches('[data-model]')&&['entryAmount','entryNote','entryActor','entryDate'].includes(el.dataset.model)){state[el.dataset.model]=el.value;}});
    document.addEventListener('change',event=>{
      const el=event.target;if(el.matches('[data-page-select]')){navigate(el.value);return;}
      if(el.matches('[data-model]')&&['entryActor','entryDate'].includes(el.dataset.model))state[el.dataset.model]=el.value;
      if(el.matches('[data-mapping-filter]'))el.closest('.device').querySelectorAll('[data-mapping-source]').forEach(row=>{row.hidden=el.value!=='all'&&row.dataset.mappingSource!==el.value;});
      if(el.matches('[data-import-choice]')){const frame=el.closest('.device');state.importSelected=[...frame.querySelectorAll('[data-import-choice]')].map(item=>item.checked);frame.querySelector('[data-import-selected]').textContent=state.importSelected.filter(Boolean).length;}
      if(el.matches('[name=import-ledger]'))state.importLedger=el.value;
      if(el.matches('[name=import-member]')){state.importActor=el.value;const scroller=el.closest('.app-scroll'),position=scroller.scrollTop;renderStage();const replacement=document.querySelector('[data-page=import-review] .app-scroll');if(replacement)replacement.scrollTop=position;}
      if(el.matches('input[type=file]')&&el.files.length)toast(t(`已选择「${el.files[0].name}」，仅展示文件名，不读取文件。`,`Selected “${el.files[0].name}”. Only the filename is displayed; contents are not read.`));
      if(el.matches('form[data-form="edit-record"] select[name="type"]')){const select=el.form.elements.category;select.innerHTML=categories.filter(c=>el.value==='income'?['salary','bonus','other'].includes(c[0]):!['salary','bonus'].includes(c[0])).map(c=>`<option value="${c[0]}">${t(c[1],c[2])}</option>`).join('');}
    });
    function formError(form,message){let el=form.querySelector('.error-message');if(!el){el=document.createElement('p');el.className='error-message';el.setAttribute('role','alert');form.append(el);}el.hidden=false;el.textContent=message;}
    document.addEventListener('submit',event=>{
      event.preventDefault();const form=event.target;if(!(form instanceof HTMLFormElement))return;
      const values=Object.fromEntries(new FormData(form).entries()),kind=form.dataset.form;
      if(!form.checkValidity()){form.reportValidity();return;}
      if(values.newPassword&&values.newPassword.length<8){formError(form,t('新密码至少需要 8 个字符。','Use at least 8 characters for a new password.'));return;}
      if(values.newPassword&&values.newPassword!==values.confirmPassword){formError(form,t('两次输入的密码不一致。','The passwords do not match.'));return;}
      if(kind==='date'){if((values.start&&!values.end)||(!values.start&&values.end)||values.start>values.end){formError(form,t('请填写有效的起止日期，结束日期不能早于开始日期。','Enter both dates, with the end on or after the start.'));return;}if(values.month)state.month=values.month;state.rangeStart=values.start||'';state.rangeEnd=values.end||'';closeDialog();renderStage();return;}
      if(kind==='filters'){const min=parseFen(values.min),max=parseFen(values.max);if((values.min&&min===null)||(values.max&&max===null)||(min!==null&&max!==null&&min>max)){formError(form,t('请输入有效的金额范围，最多保留两位小数。','Enter a valid range with up to two decimal places.'));return;}state.recordType=values.type;state.filterCategory=values.category;state.filterMin=values.min;state.filterMax=values.max;state.sort=values.sort;closeDialog();renderStage();return;}
      if(kind==='add'||kind==='edit-record'){
        const amountFen=parseFen(values.amount);if(amountFen===null||amountFen<=0){formError(form,t('请输入大于 0 的金额，最多保留两位小数。','Enter an amount above zero with up to two decimal places.'));return;}
        const ledger=kind==='add'?state.entryLedger:values.ledger;if(!ledgerOptions().some(([id])=>id===ledger)){formError(form,t('请选择使用中的账本。','Choose an active ledger.'));return;}
        const actor=values.actor;if(!['lin','xia'].includes(actor)){formError(form,t('请选择家庭成员。','Choose a household member.'));return;}
        const type=kind==='add'?state.entryType:values.type,category=kind==='add'?state.entryCategory:values.category;
        const isIncomeCategory=['salary','bonus'].includes(category);if((type==='expense'&&isIncomeCategory)||(type==='income'&&!isIncomeCategory&&category!=='other')){formError(form,t('分类与交易类型不匹配。','The category does not match the record type.'));return;}
        if(!/^\d{4}-\d{2}-\d{2}$/.test(values.date||'')){formError(form,t('请选择有效日期。','Choose a valid date.'));return;}
        const note=String(values.note||categoryInfo(category).label).trim().slice(0,120);
        const patch={amountFen,type,category,actor,date:values.date,ledger,note:[note,note]};
        if(kind==='add'){state.records.unshift({id:Date.now(),time:'12:08',...patch});state.entryNote='';state.viewLedger='all';state.member='all';state.month=values.date.slice(0,7);state.rangeStart='';state.rangeEnd='';state.search='';state.filterCategory='all';state.recordType='all';navigate('records');}
        else{const r=state.records.find(r=>r.id===activeRecordId);if(!r||r.ledger==='renovation')return;Object.assign(r,patch);closeDialog();renderStage();}
        toast(t('已保存到当前示例。','Saved to the current demo.'));return;
      }
      if(kind==='natural'){if(!state.ai){formError(form,t('请先开启 AI 处理。','Enable AI processing first.'));return;}if(!String(values.description||'').trim()){formError(form,t('请先输入一段描述。','Enter a description first.'));return;}state.nlResult=true;renderStage();toast(t('已展示固定示例解析，未调用 AI。','Showing a fixed sample result. No AI request was made.'));return;}
      if(kind==='create-ledger'){const name=String(values.name||'').trim().slice(0,30);if(!name){formError(form,t('请输入账本名称。','Enter a ledger name.'));return;}state.newLedgers.push({id:`demo-${Date.now()}`,name});closeDialog();renderStage();toast(t('示例账本已创建。','Sample ledger created.'));return;}
      if(kind==='login'){form.querySelectorAll('input[type=password]').forEach(el=>{el.value='';});navigate('home');toast(t('已进入示例家庭。','Demo household opened.'));return;}
      if(kind==='forgot'||kind==='access-application'){form.querySelectorAll('input,textarea').forEach(el=>{el.value='';});showDialog(t('请求已受理','Request received'),`<div class="stack">${notice(t('如果该邮箱可以接收此类邮件，你将收到后续说明。','If the email is eligible for this request, you will receive further instructions.'),'success')}<p class="caption">${t('这是状态预览，未实际发送邮件。','This is a state preview. No email was sent.')}</p>${actionButton(t('知道了','Done'),'close','','primary full')}</div>`);return;}
      form.querySelectorAll('input[type=password]').forEach(el=>{el.value='';});
      if(['registration','platform-registration','invite-member','ops-invite','email'].includes(kind)){closeDialog();toast(t('已展示邮件确认流程，未创建真实账号、家庭或发送邮件。','Email confirmation flow previewed. No accounts, households or emails were created.'));return;}
      closeDialog();toast(t('已预览完成状态；真实数据未改变。','Completion state previewed; real data is unchanged.'));
    });
    dialog.addEventListener('click',event=>{if(event.target===dialog){const bounds=dialog.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)closeDialog();}});
    dialog.addEventListener('close',()=>{const target=returnFocus?.isConnected?returnFocus:document.querySelector('.page-link[aria-current=page]');if(target)target.focus({preventScroll:true});returnFocus=null;});
    window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(pages.some(p=>p.id===id)){state.page=id;state.mode='focus';renderStudio();}});
    const initialPage=location.hash.slice(1);if(pages.some(p=>p.id===initialPage)){state.page=initialPage;state.mode='focus';}
    renderStudio();
  </script>
</body>
</html>
